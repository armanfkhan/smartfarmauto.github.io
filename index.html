<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm Auto | Intelligent Agriculture</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #2e7d32; /* A professional agricultural green */
            --dark-text: #1a1a1a;
            --light-bg: #ffffff;
            --accent-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light-bg);
            color: var(--dark-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            padding: 100px 20px 40px 20px;
            text-align: center;
            background: var(--accent-gradient);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .hero img {
            width: 100%;
            max-width: 280px;
            height: auto;
            /* Removed large margin to fix the gap */
            margin-bottom: 10px; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.08));
        }

        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 1.5s forwards ease-out;
        }

        /* Animation for the tagline */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Content Sections */
        .section {
            padding: 80px 20px;
            max-width: 850px;
            margin: auto;
            text-align: center;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        /* Cool underline effect for Mission */
        .mission-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: var(--primary-green);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .section p {
            font-size: 1.15rem;
            color: #444;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Contact Box "Pop" */
        .contact-box {
            margin-top: 80px;
            padding: 60px 40px;
            border-radius: 30px;
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.3s ease;
        }

        .contact-box:hover {
            transform: translateY(-5px);
        }
